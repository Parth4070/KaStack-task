[project]
name = "message-intelligence"
version = "0.1.0"
requires-python = "==3.11.*"

dependencies = [
    "fastapi[standard]",
    "pandas",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn",
    "spacy",
    "dateparser",
    "gliner",
    "sentence-transformers",
    "torch==2.7.1"
]

[tool.fastapi]
entrypoint = "api.main:app"